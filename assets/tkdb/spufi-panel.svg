<text x="0" y="203.84000000000003" xml:space="preserve"><tspan fill="#3399ff"> </tspan><tspan fill="#d0d0d0"> </tspan><tspan fill="#33cc33">Execute         ===&gt;</tspan><tspan fill="#d0d0d0"> </tspan><tspan fill="#33cc33">YES</tspan><tspan fill="#d0d0d0">  </tspan><tspan fill="#3399ff">YES runs the input through the engine</tspan><tspan fill="#d0d0d0"> </tspan><tspan fill="#3399ff">              </tspan></text>
<text x="0" y="224.64" xml:space="preserve"><tspan fill="#3399ff"> </tspan><tspan fill="#d0d0d0"> </tspan><tspan fill="#33cc33">Autocommit      ===&gt;</tspan><tspan fill="#d0d0d0"> </tspan><tspan fill="#33cccc">NO </tspan><tspan fill="#d0d0d0">  </tspan><tspan fill="#3399ff">YES commits if all statements worked, NO rolls back</tspan><tspan fill="#d0d0d0"> </tspan></text>
<text x="0" y="245.44" xml:space="preserve"><tspan fill="#3399ff"> </tspan><tspan fill="#d0d0d0"> </tspan><tspan fill="#33cc33">Browse output   ===&gt;</tspan><tspan fill="#d0d0d0"> </tspan><tspan fill="#33cc33">YES</tspan><tspan fill="#d0d0d0">  </tspan><tspan fill="#3399ff">YES browses the output data set afterwards</tspan><tspan fill="#d0d0d0"> </tspan><tspan fill="#3399ff">         </tspan></text>
<text x="0" y="266.24" xml:space="preserve"><tspan fill="#3399ff">                                                                                </tspan></text>
